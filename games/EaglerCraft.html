<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <script src="../js/theme.js"></script>
    <script src="../js/Iframes.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>

    <script src="../js/playtime.js"></script>

    <title>EaglerCraft | Ralph’s Unblocked Games</title>


    <style>

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    var(--background-1),
                    var(--background-2),
                    var(--background-3)
                );

            color: var(--text);

            min-height: 100vh;

            transition:
                background 0.4s ease,
                color 0.4s ease;
        }


        .header {
            display: flex;

            justify-content: space-between;
            align-items: center;

            padding: 15px 25px;

            background: var(--header);

            border-bottom:
                1px solid
                var(--accent);

            backdrop-filter: blur(10px);
        }


        .header h1 {
            font-size: 20px;

            margin: 0;
        }


        .header a {
            color: var(--accent);

            text-decoration: none;

            font-weight: bold;
        }


        .header a:hover {
            text-decoration: underline;
        }


        .game-wrapper {
            width: 95%;

            max-width: 1200px;

            margin: 30px auto;
        }


        /* =========================================
           VERSION SELECTOR
        ========================================= */

        .version-section {
            margin-bottom: 15px;
        }


        .version-title {
            font-size: 16px;

            font-weight: bold;

            margin-bottom: 10px;
        }


        .version-buttons {
            display: flex;

            flex-wrap: wrap;

            gap: 10px;
        }


        .version-button {
            background: var(--card);

            color: var(--text);

            border:
                1px solid
                var(--accent);

            padding: 10px 15px;

            border-radius: 8px;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

            box-shadow:
                0 4px 12px
                var(--shadow);
        }


        .version-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 0 12px
                var(--glow);
        }


        .version-button.active {
            background: var(--accent);

            color: #001018;
        }


        .version-button.locked {
            opacity: 0.8;
        }


        .version-button.locked:hover {
            opacity: 1;
        }


        .version-button:disabled {
            cursor: wait;

            opacity: 0.6;

            transform: none;

            box-shadow: none;
        }


        .version-status {
            margin-top: 8px;

            font-size: 14px;

            min-height: 18px;
        }


        /* =========================================
           GAME
        ========================================= */

        .game-container {
            position: relative;

            background: #000;

            border-radius: 12px;

            overflow: hidden;

            box-shadow:
                0 10px 30px
                var(--shadow);
        }


        iframe {
            display: block;

            width: 100%;

            height: 70vh;

            border: none;

            background: #000;
        }


        /* =========================================
           FULLSCREEN
        ========================================= */

        .game-container.css-fullscreen {
            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            max-width: none;

            margin: 0;

            border-radius: 0;

            z-index: 999999;

            box-shadow: none;
        }


        .game-container.css-fullscreen iframe {
            width: 100%;

            height: 100%;
        }


        .fullscreen-exit {
            position: absolute;

            top: 15px;
            right: 15px;

            z-index: 1000000;

            display: none;

            background: rgba(0, 0, 0, 0.65);

            color: white;

            border:
                1px solid
                rgba(255, 255, 255, 0.25);

            padding: 8px 12px;

            border-radius: 8px;

            font-size: 14px;

            cursor: pointer;

            backdrop-filter: blur(8px);
        }


        .game-container.css-fullscreen .fullscreen-exit {
            display: block;
        }


        .fullscreen-exit:hover {
            background: rgba(0, 0, 0, 0.85);
        }


        /* =========================================
           LOADING
        ========================================= */

        .loading {
            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #000;

            color: white;

            font-size: 18px;

            z-index: 5;
        }


        /* =========================================
           CONTROLS
        ========================================= */

        .controls {
            display: flex;

            justify-content: center;

            gap: 15px;

            padding: 15px;
        }


        .controls button {
            background: var(--accent);

            color: #001018;

            border: none;

            padding: 10px 18px;

            border-radius: 8px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .controls button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 0 15px
                var(--glow);
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 800px) {

            iframe {
                height: 60vh;
            }


            .header h1 {
                font-size: 16px;
            }


            .version-buttons {
                gap: 7px;
            }


            .version-button {
                padding: 8px 11px;

                font-size: 13px;
            }

        }

    </style>


    <script>

        let currentUser = null;

        let eaglerVersions = [];


        /* =========================================
           INITIALIZE
        ========================================= */

        async function initializeEaglercraft() {

            try {

                const {
                    data: {
                        user
                    },
                    error
                } = await supabaseClient.auth.getUser();


                if (error) {

                    console.error(
                        "Could not get logged-in user:",
                        error
                    );

                }


                currentUser = user || null;

            } catch (error) {

                console.error(
                    "Could not get logged-in user:",
                    error
                );

            }


            await loadVersions();


            /*
             * Load the original free version.
             */

            loadGame(EaglerCraftURL);

        }


        /* =========================================
           LOAD DATABASE VERSIONS
        ========================================= */

        async function loadVersions() {

            const {
                data,
                error
            } = await supabaseClient

                .from("eaglercraft_versions")

                .select(
                    "id, version_key, version_name, description, price, game_url, sort_order"
                )

                .eq("active", true)

                .order(
                    "sort_order",
                    {
                        ascending: true
                    }
                );


            if (error) {

                console.error(
                    "Could not load Eaglercraft versions:",
                    error
                );

                eaglerVersions = [];

            } else {

                eaglerVersions =
                    data || [];

            }


            await renderVersionButtons();

        }


        /* =========================================
           RENDER VERSION BUTTONS
        ========================================= */

        async function renderVersionButtons() {

            const container =
                document.getElementById(
                    "versionButtons"
                );


            if (!container) return;


            container.innerHTML = "";


            /*
             * ORIGINAL 1.8.8
             */

            const classicButton =
                document.createElement("button");


            classicButton.className =
                "version-button active";


            classicButton.textContent =
                "🎮 Eaglercraft 1.8.8";


            classicButton.onclick =
                function () {

                    selectClassicVersion(
                        classicButton
                    );

                };


            container.appendChild(
                classicButton
            );


            /*
             * DATABASE VERSIONS
             */

            for (
                const version
                of eaglerVersions
            ) {

                const button =
                    document.createElement(
                        "button"
                    );


                const unlocked =
                    await isVersionUnlocked(
                        version.id
                    );


                button.className =
                    "version-button";


                if (unlocked) {

                    button.textContent =
                        `🎮 ${version.version_name}`;


                    button.onclick =
                        function () {

                            selectVersion(
                                version,
                                button
                            );

                        };

                } else {

                    button.classList.add(
                        "locked"
                    );


                    button.textContent =
                        `🔒 ${version.version_name} — ${version.price} Coins`;


                    button.onclick =
                        function () {

                            unlockVersion(
                                version,
                                button
                            );

                        };

                }


                container.appendChild(
                    button
                );

            }

        }


        /* =========================================
           CHECK UNLOCK
        ========================================= */

        async function isVersionUnlocked(
            versionId
        ) {

            if (!currentUser) {

                return false;

            }


            const {
                data,
                error
            } = await supabaseClient

                .from("eaglercraft_unlocks")

                .select("id")

                .eq(
                    "user_id",
                    currentUser.id
                )

                .eq(
                    "version_id",
                    versionId
                )

                .maybeSingle();


            if (error) {

                console.error(
                    "Could not check Eaglercraft unlock:",
                    error
                );

                return false;

            }


            return !!data;

        }


        /* =========================================
           SELECT CLASSIC
        ========================================= */

        function selectClassicVersion(
            button
        ) {

            setActiveButton(
                button
            );


            setStatus(
                "Eaglercraft 1.8.8"
            );


            loadGame(
                EaglerCraftURL
            );

        }


        /* =========================================
           SELECT UNLOCKED VERSION
        ========================================= */

        function selectVersion(
            version,
            button
        ) {

            setActiveButton(
                button
            );


            setStatus(
                version.version_name
            );


            loadGame(
                version.game_url
            );

        }


        /* =========================================
           UNLOCK VERSION
        ========================================= */

        async function unlockVersion(
            version,
            button
        ) {

            if (!currentUser) {

                setStatus(
                    "You must be logged in to unlock this version."
                );

                return;

            }


            const confirmed =
                confirm(
                    `Unlock ${version.version_name} for ${version.price} coins?`
                );


            if (!confirmed) {

                return;

            }


            button.disabled = true;

            button.textContent =
                "⏳ Unlocking...";


            setStatus(
                "Processing purchase..."
            );


            try {

                const {
                    data,
                    error
                } = await supabaseClient.rpc(
                    "unlock_eaglercraft_version",
                    {
                        p_version_id:
                            version.id
                    }
                );


                if (error) {

                    throw error;

                }


                if (
                    !data ||
                    data.success !== true
                ) {

                    throw new Error(
                        "The unlock was not completed."
                    );

                }


                setStatus(
                    `${version.version_name} unlocked!`
                );


                await loadVersions();


                const buttons =
                    [
                        ...document.querySelectorAll(
                            ".version-button"
                        )
                    ];


                const unlockedButton =
                    buttons.find(
                        button =>
                            button.textContent.includes(
                                version.version_name
                            )
                    );


                if (unlockedButton) {

                    selectVersion(
                        version,
                        unlockedButton
                    );

                }

            } catch (error) {

                console.error(
                    "Eaglercraft unlock failed:",
                    error
                );


                setStatus(
                    error.message ||
                    "Could not unlock this version."
                );


                await renderVersionButtons();

            }

        }


        /* =========================================
           LOAD GAME
        ========================================= */

        function loadGame(
            url
        ) {

            const frame =
                document.getElementById(
                    "gameFrame"
                );


            const loading =
                document.getElementById(
                    "loading"
                );


            if (!frame) return;


            if (loading) {

                loading.style.display =
                    "flex";

            }


            frame.src = url;


            focusGame();

        }


        /* =========================================
           ACTIVE BUTTON
        ========================================= */

        function setActiveButton(
            activeButton
        ) {

            document
                .querySelectorAll(
                    ".version-button"
                )
                .forEach(
                    button => {

                        button.classList.remove(
                            "active"
                        );

                    }
                );


            activeButton.classList.add(
                "active"
            );

        }


        /* =========================================
           STATUS
        ========================================= */

        function setStatus(
            message
        ) {

            const status =
                document.getElementById(
                    "versionStatus"
                );


            if (status) {

                status.textContent =
                    message;

            }

        }


        /* =========================================
           FULLSCREEN
        ========================================= */

        function goFullscreen() {

            const container =
                document.querySelector(
                    ".game-container"
                );


            if (!container) return;


            container.classList.add(
                "css-fullscreen"
            );


            document.body.style.overflow =
                "hidden";


            focusGame();

        }


        /* =========================================
           EXIT FULLSCREEN
        ========================================= */

        function exitFullscreen() {

            const container =
                document.querySelector(
                    ".game-container"
                );


            if (!container) return;


            container.classList.remove(
                "css-fullscreen"
            );


            document.body.style.overflow =
                "";


            focusGame();

        }


        /* =========================================
           FOCUS GAME
        ========================================= */

        function focusGame() {

            const game =
                document.getElementById(
                    "gameFrame"
                );


            if (!game) return;


            setTimeout(
                function () {

                    game.focus();


                    try {

                        game.contentWindow.focus();

                    } catch (error) {

                        // Cross-origin iframe.
                        // Safe to ignore.

                    }

                },
                100
            );

        }


        /* =========================================
           GAME LOADED
        ========================================= */

        function gameLoaded() {

            const loading =
                document.getElementById(
                    "loading"
                );


            if (loading) {

                loading.style.display =
                    "none";

            }

        }


        /* =========================================
           ESCAPE KEY
        ========================================= */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Escape"
                ) {

                    const container =
                        document.querySelector(
                            ".game-container"
                        );


                    if (
                        container &&
                        container.classList.contains(
                            "css-fullscreen"
                        )
                    ) {

                        setTimeout(
                            focusGame,
                            100
                        );

                    }

                }

            }
        );


        /* =========================================
           F11
        ========================================= */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key !== "F11"
                ) {

                    return;

                }


                event.preventDefault();


                const container =
                    document.querySelector(
                        ".game-container"
                    );


                if (!container) return;


                if (
                    container.classList.contains(
                        "css-fullscreen"
                    )
                ) {

                    exitFullscreen();

                } else {

                    goFullscreen();

                }

            }
        );


        /* =========================================
           START
        ========================================= */

        document.addEventListener(
            "DOMContentLoaded",
            initializeEaglercraft
        );

    </script>
