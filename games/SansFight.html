<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<script src="../js/theme.js"></script>
<script src="../js/Iframes.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/playtime.js"></script>

<title>Sans Fight</title>


<style>

/* =========================================
   PAGE
========================================= */

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            var(--background-1),
            var(--background-2),
            var(--background-3)
        );

    color: var(--text);

    min-height: 100vh;

    transition:
        background 0.4s ease,
        color 0.4s ease;

}


/* =========================================
   HEADER
========================================= */

.header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 15px 25px;

    background: var(--header);

    border-bottom:
        1px solid
        var(--accent);

    backdrop-filter: blur(10px);

}


.header h1 {

    font-size: 20px;

    margin: 0;

}


.header a {

    color: var(--accent);

    text-decoration: none;

    font-weight: bold;

}


.header a:hover {

    text-decoration: underline;

}


/* =========================================
   GAME AREA
========================================= */

.game-wrapper {

    width: 95%;

    max-width: 1200px;

    margin: 30px auto;

}


.game-container {

    position: relative;

    background: #000;

    border-radius: 12px;

    overflow: hidden;

    box-shadow:
        0 10px 30px
        var(--shadow);

}


/* =========================================
   IFRAME
========================================= */

iframe {

    width: 100%;

    height: 70vh;

    border: none;

    background: #000;

}


/* =========================================
   CONTROLS
========================================= */

.controls {

    display: flex;

    justify-content: center;

    gap: 15px;

    padding: 15px;

}


.controls button {

    background: var(--accent);

    color: #001018;

    border: none;

    padding: 10px 18px;

    border-radius: 8px;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;

}


.controls button:hover {

    transform: translateY(-2px);

    box-shadow:
        0 0 15px
        var(--glow);

}


/* =========================================
   LOADING SCREEN
========================================= */

.loading {

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #000;

    color: white;

    font-size: 18px;

    z-index: 5;

}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 800px) {

    iframe {

        height: 60vh;

    }


    .header h1 {

        font-size: 16px;

    }

}

</style>


<script>

/* =========================================
   FULLSCREEN
========================================= */

function goFullscreen() {

    const game =
        document.getElementById("gameFrame");


    if (game.requestFullscreen) {

        game.requestFullscreen();

    }

    else if (game.webkitRequestFullscreen) {

        game.webkitRequestFullscreen();

    }

    else if (game.msRequestFullscreen) {

        game.msRequestFullscreen();

    }

}


/* =========================================
   REMOVE LOADING SCREEN
========================================= */

function gameLoaded() {

    document
        .getElementById("loading")
        .style.display = "none";

}

</script>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<div class="header">

    <h1>🎮 Sans Fight</h1>

    <a href="../index.html">
        ⬅ Back to Hub
    </a>

</div>



<!-- =========================================
     GAME AREA
========================================= -->

<div class="game-wrapper">

    <div class="game-container">

        <div
            class="loading"
            id="loading"
        >
            Loading Game...
        </div>


        <iframe
            id="gameFrame"
            src="${BasketBallLegends2020URL}"
            allowfullscreen
            onload="gameLoaded()">
        </iframe>


        <script>

            document
                .getElementById("gameFrame")
                .src =
                SansFightURL;

        </script>

    </div>


    <!-- CONTROLS -->

    <div class="controls">

        <button onclick="goFullscreen()">
            Fullscreen
        </button>

    </div>

</div>


</body>

</html>
