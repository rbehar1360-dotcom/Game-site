<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="../js/Iframes.js"></script>
<title>Cookie Clicker</title>

<style>

/* ===== PAGE ===== */

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#081a24,#0f2e44,#00bcd4);
    color:white;
}

/* ===== HEADER ===== */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 25px;

    background:rgba(10,25,35,0.9);
    border-bottom:1px solid rgba(0,255,255,0.3);
}

.header h1{
    font-size:20px;
    margin:0;
}

.header a{
    color:#00e5ff;
    text-decoration:none;
    font-weight:bold;
}

.header a:hover{
    text-decoration:underline;
}

/* ===== GAME AREA ===== */

.game-wrapper{
    width:95%;
    max-width:1200px;
    margin:30px auto;
}

.game-container{
    position:relative;
    background:#000;
    border-radius:12px;
    overflow:hidden;

    box-shadow:0 10px 30px rgba(0,255,255,0.25);
}

/* ===== IFRAME ===== */

iframe{
    width:100%;
    height:70vh;
    border:none;
    background:black;
}

/* ===== CONTROLS ===== */

.controls{
    display:flex;
    justify-content:center;
    gap:15px;
    padding:15px;
}

.controls button{
    background:#00bcd4;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;

    transition:0.2s;
}

.controls button:hover{
    background:#00e5ff;
    transform:translateY(-2px);
}

/* ===== LOADING SCREEN ===== */

.loading{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#000;
    color:white;
    font-size:18px;
}

/* ===== MOBILE ===== */

@media (max-width:800px){

iframe{
    height:60vh;
}

.header h1{
    font-size:16px;
}

}

</style>


<script>

/* FULLSCREEN */

function goFullscreen(){
    const game = document.getElementById("gameFrame");

    if(game.requestFullscreen){
        game.requestFullscreen();
    }
    else if(game.webkitRequestFullscreen){
        game.webkitRequestFullscreen();
    }
    else if(game.msRequestFullscreen){
        game.msRequestFullscreen();
    }
}


/* REMOVE LOADING SCREEN WHEN GAME LOADS */

function gameLoaded(){
    document.getElementById("loading").style.display="none";
}

</script>

</head>


<body>

<!-- HEADER -->

<div class="header">

<h1>🎮 Cookie Clicker</h1>

<a href="../index.html">⬅ Back to Hub</a>

</div>



<!-- GAME AREA -->

<div class="game-wrapper">

<div class="game-container">

<div class="loading" id="loading">
Loading Game...
</div>

<iframe
id="gameFrame"
src="${cookieClicker}"
allow="fullscreen; autoplay; clipboard-read; clipboard-write; pointer-lock; keyboard-map"
allowfullscreen
onload="gameLoaded()">
</iframe>
<script>
document.getElementById("gameFrame").src = cookieClicker;
</script>
</div>


<!-- CONTROLS -->

<div class="controls">

<button onclick="goFullscreen()">Fullscreen</button>

</div>

</div>

</body>
</html>
