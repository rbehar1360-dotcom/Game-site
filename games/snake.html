<style>

/* =========================================
   PAGE
========================================= */

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            var(--background-1),
            var(--background-2),
            var(--background-3)
        );

    color: var(--text);

    min-height: 100vh;

    transition:
        background 0.4s ease,
        color 0.4s ease;

}


/* =========================================
   HEADER
========================================= */

.header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 15px 25px;

    background: var(--header);

    border-bottom:
        1px solid
        var(--accent);

    backdrop-filter: blur(10px);

}


.header h1 {

    font-size: 20px;

    margin: 0;

}


.header a {

    color: var(--accent);

    text-decoration: none;

    font-weight: bold;

}


.header a:hover {

    text-decoration: underline;

}


/* =========================================
   GAME AREA
========================================= */

.game-wrapper {

    width: 95%;

    max-width: 1200px;

    margin: 30px auto;

}


.game-container {

    display: flex;

    justify-content: center;

    align-items: center;

    min-height: 70vh;

    background: var(--card);

    border:
        1px solid
        var(--accent);

    border-radius: 12px;

    overflow: hidden;

    box-shadow:
        0 10px 30px
        var(--shadow);

}


/* =========================================
   SNAKE CANVAS
========================================= */

canvas {

    background: #000;

    border:
        2px solid
        var(--accent);

    image-rendering: pixelated;

    max-width: 90%;

    height: auto;

    box-shadow:
        0 0 20px
        var(--glow);

}


/* =========================================
   CONTROLS
========================================= */

.controls {

    display: flex;

    justify-content: center;

    gap: 15px;

    padding: 15px;

}


.controls button {

    background: var(--accent);

    color: #001018;

    border: none;

    padding: 10px 18px;

    border-radius: 8px;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;

}


.controls button:hover {

    transform: translateY(-2px);

    box-shadow:
        0 0 15px
        var(--glow);

}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 800px) {

    .header h1 {

        font-size: 16px;

    }


    .game-container {

        min-height: 60vh;

    }


    canvas {

        max-width: 95%;

    }

}

</style>


<script>

/* =========================================
   FULLSCREEN
========================================= */

function goFullscreen() {

    const game =
        document.getElementById("game");


    if (game.requestFullscreen) {

        game.requestFullscreen();

    }

    else if (game.webkitRequestFullscreen) {

        game.webkitRequestFullscreen();

    }

    else if (game.msRequestFullscreen) {

        game.msRequestFullscreen();

    }

}

</script>
