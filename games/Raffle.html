<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raffle</title>
<script src="../js/Raffle.js"></script>
<script src="../js/theme.js"></script>
<style>
    body {
        margin: 0;
        background-color: #000;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: white;
    }

    .game-container {
        background-color: #111;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        width: 90%;
        max-width: 1000px;
        text-align: center;
    }

    h1 {
        margin-bottom: 20px;
        font-size: 24px;
    }

    iframe {
        width: 100%;
        height: 600px;
        border: none;
        border-radius: 8px;
        background-color: black;
    }

    .back-btn {
        margin-top: 15px;
        display: inline-block;
        padding: 10px 15px;
        background-color: #222;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        transition: 0.2s;
    }

    .back-btn:hover {
        background-color: #444;
    }
</style>

</head>
<body>

<div class="game-container">
    <h1>Raffle!</h1>
    <button style="font-size: 30px; padding: 20px 40px;" onclick="drawRaffle()"> 🎁 </button>
    <p id="PlaceHolder"></p>
    <br>
    <a href="../index.html" class="back-btn">⬅ Back to Hub</a>
</div>

</body>
</html>
