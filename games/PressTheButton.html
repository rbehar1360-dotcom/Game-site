<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<script src="../js/theme.js"></script>
<script src="../js/PressThatButton.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/playtime.js"></script>

<title>Press The Button!</title>


<style>

/* =========================================
   PAGE
========================================= */

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            var(--background-1),
            var(--background-2),
            var(--background-3)
        );

    color: var(--text);

    min-height: 100vh;

    transition:
        background 0.4s ease,
        color 0.4s ease;

}


/* =========================================
   HEADER
========================================= */

.header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 15px 25px;

    background: var(--header);

    border-bottom:
        1px solid
        var(--accent);

    backdrop-filter: blur(10px);

}


.header h1 {

    font-size: 20px;

    margin: 0;

}


.header a {

    color: var(--accent);

    text-decoration: none;

    font-weight: bold;

}


.header a:hover {

    text-decoration: underline;

}


/* =========================================
   GAME AREA
========================================= */

.game-wrapper {

    width: 95%;

    max-width: 1200px;

    margin: 30px auto;

}


.game-container {

    position: relative;

    background: var(--card);

    border:
        1px solid
        var(--accent);

    border-radius: 12px;

    overflow: hidden;

    padding: 40px 20px;

    text-align: center;

    height: 350px;

    box-sizing: border-box;

    box-shadow:
        0 10px 30px
        var(--shadow);

    transition:
        background 0.4s ease,
        border-color 0.4s ease,
        box-shadow 0.4s ease;

}


/* =========================================
   GAME CONTENT
========================================= */

.game-container h2 {

    font-size: 24px;

    margin-top: 0;

    margin-bottom: 25px;

    color: var(--title);

}


.main-btn {

    font-size: 28px;

    padding: 18px 40px;

    background: var(--accent);

    border: none;

    border-radius: 8px;

    color: #001018;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 4px 15px
        var(--shadow);

    transition: 0.2s ease;

}


.main-btn:hover {

    transform: translateY(-3px);

    box-shadow:
        0 0 20px
        var(--glow);

}


.main-btn:active {

    transform: translateY(-1px);

}


.status-text {

    margin-top: 25px;

    color: var(--text);

    font-weight: normal;

}


#clicksLeft {

    color: var(--accent);

    font-size: 20px;

    margin-top: 10px;

}


/* =========================================
   CONTROLS
========================================= */

.controls {

    display: flex;

    justify-content: center;

    gap: 15px;

    padding: 15px;

}


.controls button {

    background: var(--accent);

    color: #001018;

    border: none;

    padding: 10px 18px;

    border-radius: 8px;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;

}


.controls button:hover {

    transform: translateY(-2px);

    box-shadow:
        0 0 15px
        var(--glow);

}


/* =========================================
   LOADING SCREEN
========================================= */

.loading {

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #000;

    color: white;

    font-size: 18px;

    z-index: 10;

}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 800px) {

    .header h1 {

        font-size: 16px;

    }


    .main-btn {

        font-size: 24px;

        padding: 15px 32px;

    }

}

</style>


<script>

/* =========================================
   FULLSCREEN
========================================= */

function goFullscreen() {

    const gameContainer =
        document.getElementById("gameContent");


    if (gameContainer.requestFullscreen) {

        gameContainer.requestFullscreen();

    }

    else if (gameContainer.webkitRequestFullscreen) {

        gameContainer.webkitRequestFullscreen();

    }

    else if (gameContainer.msRequestFullscreen) {

        gameContainer.msRequestFullscreen();

    }

}


/* =========================================
   REMOVE LOADING SCREEN
========================================= */

window.addEventListener("load", function () {

    document
        .getElementById("loading")
        .style.display = "none";

});

</script>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<div class="header">

    <h1>🔴 Press The Button!</h1>

    <a href="../index.html">
        ⬅ Back to Hub
    </a>

</div>



<!-- =========================================
     GAME AREA
========================================= -->

<div class="game-wrapper">

    <div
        class="game-container"
        id="gameContent"
    >

        <div
            class="loading"
            id="loading"
        >
            Loading Game...
        </div>


        <h2>
            Press The Button!
        </h2>


        <button
            class="main-btn"
            onclick="pressButton()"
        >
            Press Me!
        </button>


        <h3
            id="RemoveMe"
            class="status-text"
        >
            Click to see how many clicks left!
        </h3>


        <h3 id="clicksLeft">
            Clicks Left:
        </h3>

    </div>


    <!-- CONTROLS -->

    <div class="controls">

        <button onclick="goFullscreen()">
            Fullscreen
        </button>

    </div>

</div>

</body>

</html>
