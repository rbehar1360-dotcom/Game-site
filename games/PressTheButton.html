<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="../js/PressThatButton.js"></script>
<script src="../js/theme.js"></script>
<title>Press The Button!</title>

<style>

/* ===== PAGE ===== */

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#081a24,#0f2e44,#00bcd4);
    color:white;
    background-attachment: fixed;
}

/* ===== HEADER ===== */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 25px;

    background:rgba(10,25,35,0.9);
    border-bottom:1px solid rgba(0,255,255,0.3);
}

.header h1{
    font-size:20px;
    margin:0;
}

.header a{
    color:#00e5ff;
    text-decoration:none;
    font-weight:bold;
}

.header a:hover{
    text-decoration:underline;
}

/* ===== GAME AREA ===== */

.game-wrapper{
    width:95%;
    max-width:1200px;
    margin:30px auto;
}

.game-container{
    position:relative;
    background:#0a1923;
    border-radius:12px;
    overflow:hidden;
    padding:40px 20px;
    text-align:center;
    height: 350px;

    box-shadow:0 10px 30px rgba(0,255,255,0.25);
    border: 1px solid rgba(0, 255, 255, 0.1);
}

/* ===== GAME INTERACTION ELEMENTS ===== */

.game-container h2 {
    font-size: 24px;
    margin-top: 0;
    margin-bottom: 25px;
    color: #fff;
}

.main-btn {
    font-size: 28px;
    padding: 18px 40px;
    background: #00bcd4;
    border: none;
    border-radius: 8px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0, 188, 212, 0.4);
    transition: 0.2s ease;
}

.main-btn:hover {
    background: #00e5ff;
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(0, 229, 255, 0.6);
}

.main-btn:active {
    transform: translateY(-1px);
}

.status-text {
    margin-top: 25px;
    color: #b0bec5;
    font-weight: normal;
}

#clicksLeft {
    color: #00e5ff;
    font-size: 20px;
    margin-top: 10px;
}

/* ===== CONTROLS ===== */

.controls{
    display:flex;
    justify-content:center;
    gap:15px;
    padding:15px;
}

.controls button{
    background:#00bcd4;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;

    transition:0.2s;
}

.controls button:hover{
    background:#00e5ff;
    transform:translateY(-2px);
}

/* ===== LOADING SCREEN ===== */

.loading{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#000;
    color:white;
    font-size:18px;
    z-index: 10;
}

/* ===== MOBILE ===== */

@media (max-width:800px){

    .header h1{
        font-size:16px;
    }
    
    .main-btn {
        font-size: 24px;
        padding: 15px 32px;
    }

}

</style>


<script>

/* FULLSCREEN FOR NON-IFRAME CONTAINER */
function goFullscreen(){
    const gameContainer = document.getElementById("gameContent");

    if(gameContainer.requestFullscreen){
        gameContainer.requestFullscreen();
    }
    else if(gameContainer.webkitRequestFullscreen){
        gameContainer.webkitRequestFullscreen();
    }
    else if(gameContainer.msRequestFullscreen){
        gameContainer.msRequestFullscreen();
    }
}

/* HIDE LOADING SCREEN ONCE THE PAGE ASSETS ARE READY */
window.addEventListener('load', function() {
    document.getElementById("loading").style.display="none";
});

</script>

</head>


<body>

<div class="header">

<h1>🔴 Press The Button!</h1>

<a href="../index.html">⬅ Back to Hub</a>

</div>



<div class="game-wrapper">

<div class="game-container" id="gameContent">

    <div class="loading" id="loading">
    Loading Game...
    </div>

    <h2>Press The Button!</h2>
    
    <button class="main-btn" onclick="pressButton()">Press Me!</button>
    
    <h3 id="RemoveMe" class="status-text">Click to see how many clicks left!</h3>
    <h3 id="clicksLeft">Clicks Left: </h3>

</div>


<div class="controls">

<button onclick="goFullscreen()">Fullscreen</button>

</div>

</div>

</body>
</html>
