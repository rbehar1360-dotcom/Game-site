<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="../js/Iframes.js"></script>
<script src="../js/theme.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>

<script src="../js/playtime.js"></script>

<title>Geometry Dash</title>


<style>

/* =========================================
   PAGE
========================================= */

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            var(--background-1),
            var(--background-2),
            var(--background-3)
        );

    color: var(--text);

    min-height: 100vh;

    transition:
        background 0.4s ease,
        color 0.4s ease;
}


/* =========================================
   HEADER
========================================= */

.header {

    display: flex;

    justify-content: space-between;
    align-items: center;

    padding: 15px 25px;

    background: var(--header);

    border-bottom:
        1px solid
        color-mix(
            in srgb,
            var(--accent) 30%,
            transparent
        );

    backdrop-filter: blur(10px);
}


.header h1 {

    font-size: 20px;

    margin: 0;

    color: var(--text);
}


.header a {

    color: var(--accent);

    text-decoration: none;

    font-weight: bold;

    transition: 0.2s ease;
}


.header a:hover {

    color: var(--accent-light);

    text-decoration: underline;

}


/* =========================================
   GAME AREA
========================================= */

.game-wrapper {

    width: 95%;

    max-width: 1200px;

    margin: 30px auto;

}


/* =========================================
   GAME CONTAINER
========================================= */

.game-container {

    position: relative;

    background: #000;

    border-radius: 12px;

    overflow: hidden;

    box-shadow:
        0 10px 30px var(--shadow);
}


/* =========================================
   IFRAME
========================================= */

iframe {

    width: 100%;

    height: 70vh;

    border: none;

    background: #000;

}


/* =========================================
   SERVER SWITCHER
========================================= */

.server-panel {

    margin-top: 15px;

    padding: 15px;

    background: var(--header);

    border-radius: 10px;

    text-align: center;

}


.server-panel p {

    margin-top: 0;

    margin-bottom: 12px;

    font-size: 14px;

}


.server-buttons {

    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 10px;

}


.server-buttons button {

    background: var(--accent);

    color: #001018;

    border: none;

    padding: 9px 15px;

    border-radius: 7px;

    font-size: 14px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s ease;

}


.server-buttons button:hover {

    background: var(--accent-light);

    transform: translateY(-2px);

    box-shadow:
        0 0 15px var(--glow);

}


.server-buttons button.active {

    outline:
        2px solid
        var(--accent-light);

}


/* =========================================
   CONTROLS
========================================= */

.controls {

    display: flex;

    justify-content: center;

    gap: 15px;

    padding: 15px;

}


.controls button {

    background: var(--accent);

    color: #001018;

    border: none;

    padding: 10px 18px;

    border-radius: 8px;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s ease;
}


.controls button:hover {

    background: var(--accent-light);

    transform: translateY(-2px);

    box-shadow:
        0 0 15px var(--glow);

}


/* =========================================
   LOADING SCREEN
========================================= */

.loading {

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    background: var(--header);

    color: var(--text);

    font-size: 18px;

    z-index: 10;

    text-align: center;

}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 800px) {

    iframe {

        height: 60vh;

    }


    .header h1 {

        font-size: 16px;

    }

}

</style>


<script>

/* =========================================
   GAME SERVERS
========================================= */

/*
    Put your actual URLs here.

    You can add as many servers as you want.
*/

const GeometryDashServers = [

    {
        name: "Server 1",
        url: "https://totalclick.org/games/geodash/game/index.html"
    },

    {
        name: "Server 2",
        url: "https://YOUR-SERVER-2.com/game/"
    },

    {
        name: "Server 3",
        url: "https://YOUR-SERVER-3.com/game/"
    },

    {
        name: "Server 4",
        url: "https://YOUR-SERVER-4.com/game/"
    }

];


/* =========================================
   LOAD SERVER
========================================= */

function loadGameServer(index) {

    const iframe =
        document.getElementById("gameFrame");

    const loading =
        document.getElementById("loading");


    const server =
        GeometryDashServers[index];


    if (!server) {

        return;

    }


    /*
        Show loading screen.
    */

    loading.style.display = "flex";

    loading.innerHTML = `

        <div>

            Loading ${server.name}...

        </div>

    `;


    /*
        Change iframe.
    */

    iframe.src = server.url;


    /*
        Update active button.
    */

    document
        .querySelectorAll(".server-button")
        .forEach(button => {

            button.classList.remove("active");

        });


    const selectedButton =
        document.querySelector(
            `[data-server="${index}"]`
        );


    if (selectedButton) {

        selectedButton.classList.add("active");

    }


    console.log(
        "Loading:",
        server.name,
        server.url
    );

}


/* =========================================
   GAME LOADED
========================================= */

function gameLoaded() {

    document
        .getElementById("loading")
        .style.display = "none";

}


/* =========================================
   FULLSCREEN
========================================= */

function goFullscreen() {

    const game =
        document.getElementById("gameFrame");


    if (game.requestFullscreen) {

        game.requestFullscreen();

    }

    else if (game.webkitRequestFullscreen) {

        game.webkitRequestFullscreen();

    }

    else if (game.msRequestFullscreen) {

        game.msRequestFullscreen();

    }

}


/* =========================================
   START GAME
========================================= */

window.addEventListener(
    "DOMContentLoaded",
    () => {

        loadGameServer(0);

    }
);

</script>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<div class="header">

    <h1>🎮 Geometry Dash</h1>

    <a href="../index.html">
        ⬅ Back to Hub
    </a>

</div>


<!-- =========================================
     GAME AREA
========================================= -->

<div class="game-wrapper">


    <div class="game-container">


        <div
            class="loading"
            id="loading"
        >

            Loading Game...

        </div>


        <iframe
            id="gameFrame"
            src="about:blank"
            allowfullscreen
            onload="gameLoaded()"
        ></iframe>


    </div>


    <!-- =========================================
         SERVER OPTIONS
    ========================================== -->

    <div class="server-panel">

        <p>
            Game won't load?
            Try another server:
        </p>


        <div class="server-buttons">


            <button
                class="server-button active"
                data-server="0"
                onclick="loadGameServer(0)"
            >
                Server 1
            </button>


            <button
                class="server-button"
                data-server="1"
                onclick="loadGameServer(1)"
            >
                Server 2
            </button>


            <button
                class="server-button"
                data-server="2"
                onclick="loadGameServer(2)"
            >
                Server 3
            </button>


            <button
                class="server-button"
                data-server="3"
                onclick="loadGameServer(3)"
            >
                Server 4
            </button>


        </div>

    </div>


    <!-- =========================================
         CONTROLS
    ========================================== -->

    <div class="controls">

        <button onclick="goFullscreen()">

            Fullscreen

        </button>

    </div>


</div>


</body>

</html>
