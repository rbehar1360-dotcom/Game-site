<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Iframe Test Site</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #111;
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        .input-container {
            margin: 20px;
        }

        input {
            width: 60%;
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            border: none;
            color: white;
        }

        iframe {
            width: 90%;
            height: 600px;
            border: 2px solid white;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Iframe Embed Tester</h1>

    <div class="input-container">
        <input type="text" id="urlInput" placeholder="Paste game URL here...">
        <button onclick="loadGame()">Load</button>
    </div>

    <iframe id="gameFrame"></iframe>

    <script>
        function loadGame() {
            const url = document.getElementById("urlInput").value;
            document.getElementById("gameFrame").src = url;
        }
    </script>

</body>
</html>
